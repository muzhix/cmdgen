name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Install aarch64 cross build dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64

          # ubuntu-latest also ships third-party apt sources that have no arm64
          # index. Pin those to amd64, then add an arm64-only Ubuntu source so
          # `libdbus-1-dev:arm64` can be installed for the cross linker.
          shopt -s nullglob
          for src in /etc/apt/sources.list.d/*.sources; do
            if grep -q '^Architectures:' "$src"; then
              continue
            fi
            sudo sed -i '/^Types: deb$/a Architectures: amd64' "$src"
          done
          for lst in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            if [ ! -f "$lst" ]; then
              continue
            fi
            sudo sed -i -E \
              -e '/^deb \[/ { /\[arch=/! s/^deb \[/deb [arch=amd64 / }' \
              -e '/^deb / { /\[/! s/^deb /deb [arch=amd64] / }' \
              "$lst"
          done

          . /etc/os-release
          sudo tee /etc/apt/sources.list.d/arm64-ports.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-security
          Components: main
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            pkg-config \
            libdbus-1-dev:arm64
          PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig \
            pkg-config --libs --cflags dbus-1
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            # libdbus-sys refuses to call pkg-config while cross-compiling
            # unless this is set, and the host dbus .pc file is the wrong arch.
            export PKG_CONFIG_ALLOW_CROSS=1
            export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
            export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-Wl,-rpath-link,/usr/lib/aarch64-linux-gnu"
          fi
          cargo build --release --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          stage="cmdgen-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/cmdgen" "$stage/cmdgen"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: cmdgen-${{ matrix.target }}.tar.gz

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
