[package]
name = "cmdgen"
version = "0.1.4"
edition = "2021"
rust-version = "1.85"
description = "AI-powered shell command generation for your terminal."
license = "MIT"
readme = "README.md"
keywords = ["shell", "cli", "command-line"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "6"
keyring = { version = "3.6", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
